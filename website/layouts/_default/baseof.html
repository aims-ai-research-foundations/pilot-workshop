<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  {{- partial "header.html" . }}
  <main>
    {{- block "main" . }}{{- end }}
  </main>
  {{- partial "footer.html" . }}
  <script>
    document.querySelectorAll('.nav-toggle').forEach(function(b) {
      b.addEventListener('click', function() {
        document.querySelector('.nav').classList.toggle('open');
      });
    });

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      document.querySelectorAll('.fade-in, .fade-in-stagger').forEach(function(el) { io.observe(el); });
    } else {
      document.querySelectorAll('.fade-in, .fade-in-stagger').forEach(function(el) { el.classList.add('is-visible'); });
    }
  </script>
</body>
</html>
