<header class="site-header">
  <div class="inner">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="AIMS AI Research Foundations Pilot Workshop, home">
      <img class="brand-logo" src="{{ "img/logos/logo-white.svg" | relURL }}" alt="AIMS AI Research Foundations Pilot Workshop" height="44">
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <nav class="nav" aria-label="Primary">
      {{- range .Site.Menus.main }}
      <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
  </div>
</header>
